description: >-
  Runs a content-factory day_top5/ai digest Issue and waits for it to finish
  on the schedule below.
labels:
  - workspace: content-factory
schedule:
  - "CRON_TZ=Europe/Berlin 0 10 * * *"
  - "CRON_TZ=Europe/Berlin 0 17 * * *"
working_dir: /workspace
queue: content
timeout_sec: 3600
params:
  - FORMAT: day_top5
  - TOPIC: ai
env:
  - RUN_ID: ${DAG_RUN_ID}
steps:
  - name: run-issue
    run: scripts/content-digest.sh
