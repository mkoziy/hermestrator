description: >-
  Runs a content-factory day_top5/software digest Issue and waits for it to finish
  (mirrors the schedule formerly kept in the app's Settings).
schedule:
  - "CRON_TZ=Europe/Berlin 30 10 * * *"
  - "CRON_TZ=Europe/Berlin 30 17 * * *"
queue: content
timeout_sec: 3600
params:
  - FORMAT: day_top5
  - TOPIC: software
env:
  - RUN_ID: ${DAG_RUN_ID}
steps:
  - name: run-issue
    run: scripts/content-digest.sh
