description: >-
  Runs a content-factory trending_top5/ai digest Issue and waits for it to finish
  on the schedule below.
schedule:
  - "CRON_TZ=Europe/Berlin 0 11 * * *"
  - "CRON_TZ=Europe/Berlin 0 18 * * *"
queue: content
timeout_sec: 3600
params:
  - FORMAT: trending_top5
  - TOPIC: ai
env:
  - RUN_ID: ${DAG_RUN_ID}
steps:
  - name: run-issue
    run: scripts/content-digest.sh
