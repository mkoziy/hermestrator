description: >-
  Runs a content-factory week_top10/software digest Issue and waits for it to finish
  on the schedule below.
schedule:
  - "CRON_TZ=Europe/Berlin 30 13 * * 6"
working_dir: /workspace
queue: content
timeout_sec: 3600
params:
  - FORMAT: week_top10
  - TOPIC: software
env:
  - RUN_ID: ${DAG_RUN_ID}
steps:
  - name: run-issue
    run: scripts/content-digest.sh
