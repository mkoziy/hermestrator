name: Build and push image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # dev: today's ralphex-based coding-worker/orchestrator image.
          - target: dev
            tag_prefix: ""
          # qa: browser-driven QA worker (invokes codex/pi directly, no
          # ralphex) — see docs/plans/20260916-qa-agent-flow.md.
          - target: qa
            tag_prefix: "qa-"
          # ephemeral: all-in-one orchestrator+coding-worker+qa-worker for
          # worker/ephemeral-entrypoint.sh — see docs/remote-worker.md
          # "Ephemeral all-in-one worker".
          - target: ephemeral
            tag_prefix: "ephemeral-"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 --ignore DL3016 --ignore DL3059 --ignore SC2016 - < worker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag,prefix=${{ matrix.tag_prefix }}
            type=raw,value=${{ matrix.tag_prefix }}latest

      # Build locally first so the worker runtime is validated before anything
      # reaches the registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Validate image (dev)
        if: matrix.target == 'dev'
        run: |
          set -euo pipefail
          image="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          docker run --rm --entrypoint sh "$image" -eu -c 'swamp version; ralphex --version; codex --version; pi --version; gremlins --version; gh --version; git --version; jq --version; node --version; mise --version'

      - name: Validate image (qa)
        if: matrix.target == 'qa'
        run: |
          set -euo pipefail
          image="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          docker run --rm --entrypoint sh "$image" -eu -c 'swamp version; codex --version; pi --version; agent-browser --version; chromium --version; gh --version; git --version; jq --version; node --version; mise --version'

      - name: Validate image (ephemeral)
        if: matrix.target == 'ephemeral'
        run: |
          set -euo pipefail
          image="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          docker run --rm --entrypoint sh "$image" -eu -c 'swamp version; ralphex --version; codex --version; pi --version; gremlins --version; agent-browser --version; chromium --version; gh --version; git --version; jq --version; node --version; mise --version; bash -n /usr/local/bin/ephemeral-entrypoint'

      - name: Push image
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
