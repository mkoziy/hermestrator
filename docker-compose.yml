services:
  dagu:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # The notes vault has its own credential. Do not alias it to an
      # owner-specific ticket-worker token.
      VAULT_GH_TOKEN: ${VAULT_GH_TOKEN:-}
      GH_TOKEN_MOONTECHS: ${GH_TOKEN_MOONTECHS:-}
      GH_TOKEN_MKOZIY: ${GH_TOKEN_MKOZIY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    volumes:
      - dagu_home:/var/lib/dagu
      - hermestrator_artifacts:/var/lib/hermestrator/artifacts
      - vault_clone:/workspace/.vault-clone
      - codex_home:/home/worker/.codex
      - pi_agent_home:/home/worker/.pi/agent
    stop_grace_period: 5m
    restart: unless-stopped

volumes:
  dagu_home:
  hermestrator_artifacts:
  vault_clone:
  codex_home:
  pi_agent_home:
