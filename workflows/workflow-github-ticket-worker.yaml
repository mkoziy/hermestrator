id: 89d87955-e088-44cb-859d-438a8ba0789a
name: github-ticket-worker
description: >-
  Manually implement one open GitHub issue with ralphex and open or reuse its pull request.
  Requires branch agent/issue-<issue_number> to already exist on origin with a ralphex plan
  committed to docs/plans/; fails otherwise.
inputs:
  type: object
  properties:
    repo:
      type: string
      description: GitHub repository in owner/name form.
    issue_number:
      type: integer
      description: Open GitHub issue number to implement.
    base_branch:
      type: string
      default: main
      description: Branch the implementation must target.
    require_agent_ready:
      type: boolean
      default: false
      description: Set true to require the future agent-ready label gate.
    ralphex_config:
      type: string
      default: ralphex-codex
      enum:
        - ralphex-codex
        - ralphex-pi
      description: Installed ralphex profile selected from ~/.config.
  required:
    - repo
    - issue_number
tags: {}
jobs:
  - name: main
    description: Validate, implement through ralphex, and create or reuse one pull request.
    steps:
      - name: implement-github-issue
        description: >-
          Runs the isolated manual GitHub issue implementation slice. ignoreExitCode is
          required here: without it, a failing ralphex run makes the model_method call
          itself fail, and swamp records NO "result"/"log" data output at all on a
          failed command/shell call (confirmed empirically) — which would silently
          starve vault-sync's data.query(...)-guarded write-note step even though
          github-ticket-worker.sh's own cleanup trap already emits a VAULT_NOTE_JSON
          failed note. The exitCode still comes back on the recorded result, so the
          check-implement-exit assert step below reconstructs the allowFailure:false
          job-failure signal.
        task:
          type: model_method
          modelIdOrName: github_ticket_worker_shell
          methodName: execute
          inputs:
            run: scripts/github-ticket-worker.sh
            workingDir: .
            timeout: 7200000
            ignoreExitCode: true
            env:
              REPO: ${{ inputs.repo }}
              ISSUE_NUMBER: ${{ string(inputs.issue_number) }}
              BASE_BRANCH: ${{ inputs.base_branch }}
              REQUIRE_AGENT_READY: ${{ string(inputs.require_agent_ready) }}
              WORKFLOW_RUN_ID: ${{ run.id }}
              RALPHEX_CONFIG: ${{ inputs.ralphex_config }}
        dependsOn: []
        weight: 0
        allowFailure: false
        labels:
          pool: coding
      - name: check-implement-exit
        description: >-
          Fails the job (and workflow) when the worker script itself exited non-zero,
          restoring the allowFailure:false signal that ignoreExitCode above otherwise
          swallows. Scoped to this run's workflowRunId (like write-note/vault-commit
          below) so a concurrent run's result can't be read instead. Uses a
          size(...)>0 short-circuit (CEL && is lazy) so an implement-github-issue that
          produced NO queryable result record at all (worker killed/crashed/dispatch
          failure before recording) fails this assert with a clear message instead of
          an opaque out-of-bounds index error — a missing result record is itself a
          failure signal, not a pass.
        task:
          type: assert
          expr: >-
            size(data.query('modelName == "github_ticket_worker_shell" && name ==
            "result" && workflowRunId == "' + run.id + '"')) > 0 &&
            data.query('modelName == "github_ticket_worker_shell" && name ==
            "result" && workflowRunId == "' + run.id + '"')[0].attributes.exitCode == 0
          message: >-
            ${{ size(data.query('modelName == "github_ticket_worker_shell" && name ==
            "result" && workflowRunId == "' + run.id + '"')) > 0 ?
            "github-ticket-worker.sh exited " + string(data.query('modelName ==
            "github_ticket_worker_shell" && name == "result" && workflowRunId == "'
            + run.id + '"')[0].attributes.exitCode) :
            "github-ticket-worker.sh produced no result record for this run (worker
            crashed or was never dispatched)" }}
          severity: high
        dependsOn:
          - step: implement-github-issue
            condition:
              type: completed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: vault-sync
    description: >-
      Best-effort mirror of the ralphex run (progress log, ticket, PR link) into
      the Obsidian vault. Runs whether main succeeded or failed, and never fails
      the overall workflow run.
    dependsOn:
      - job: main
        condition:
          type: always
    weight: 0
    steps:
      - name: vault-pull
        description: Bring the local vault checkout up to date before writing.
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: pull
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: write-note
        description: >-
          Render this run's ticket.md and runs/<timestamp>.md into the vault checkout.
          Uses this run's output when it exists; otherwise writes a failed-run fallback
          from the workflow inputs, so a timeout cannot erase the ticket history.
        task:
          type: model_method
          modelIdOrName: vault_note_writer_shell
          methodName: execute
          inputs:
            run: scripts/vault-write-note.sh
            workingDir: .
            timeout: 60000
            env:
              NOTE_JSON_RAW: >-
                ${{ size(data.query('modelName == "github_ticket_worker_shell" && name ==
                "result" && workflowRunId == "' + run.id + '"')) > 0
                ? data.query('modelName == "github_ticket_worker_shell" && name ==
                "result" && workflowRunId == "' + run.id + '"')[0].attributes.stdout : "" }}
              REPO: ${{ inputs.repo }}
              ISSUE_NUMBER: ${{ string(inputs.issue_number) }}
              RALPHEX_CONFIG: ${{ inputs.ralphex_config }}
              WORKFLOW_RUN_ID: ${{ run.id }}
              VAULT_DIR: .vault-clone
        dependsOn:
          - step: vault-pull
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: vault-commit
        description: >-
          Commit the rendered note(s); guarded off when there was nothing to sync.
          Scoped to this run's workflowRunId (like write-note above) so a concurrent
          run of this or the sibling actions workflow can't be read instead.
        guard: >-
          ${{ !(size(data.query('modelName == "vault_note_writer_shell" && name ==
          "result" && workflowRunId == "' + run.id + '"')) > 0 &&
          data.query('modelName == "vault_note_writer_shell" && name ==
          "result" && workflowRunId == "' + run.id +
          '"')[0].attributes.stdout.contains("NOTE_WRITTEN")) }}
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: commit
          inputs:
            message: "chore: sync ralphex run notes"
            addAll: true
        dependsOn:
          - step: write-note
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: vault-push
        description: Push the synced notes to the vault remote.
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: push
          inputs:
            branch: main
            setUpstream: true
        dependsOn:
          - step: vault-commit
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
version: 1
