id: 89d87955-e088-44cb-859d-438a8ba0789a
name: github-ticket-worker
description: >-
  Manually implement one open GitHub issue with ralphex and open or reuse its pull request.
  Requires branch agent/issue-<issue_number> to already exist on origin with a ralphex plan
  committed to docs/plans/; fails otherwise.
inputs:
  type: object
  properties:
    repo:
      type: string
      description: GitHub repository in owner/name form.
    issue_number:
      type: integer
      description: Open GitHub issue number to implement.
    base_branch:
      type: string
      default: main
      description: Branch the implementation must target.
    require_agent_ready:
      type: boolean
      default: false
      description: Set true to require the future agent-ready label gate.
    ralphex_config:
      type: string
      default: ralphex-codex
      enum:
        - ralphex-codex
        - ralphex-pi
      description: Installed ralphex profile selected from ~/.config.
  required:
    - repo
    - issue_number
tags: {}
jobs:
  - name: main
    description: Validate, implement through ralphex, and create or reuse one pull request.
    steps:
      - name: implement-github-issue
        description: Runs the isolated manual GitHub issue implementation slice.
        task:
          type: model_method
          modelIdOrName: github_ticket_worker_shell
          methodName: execute
          inputs:
            run: scripts/github-ticket-worker.sh
            workingDir: .
            timeout: 7200000
            env:
              REPO: ${{ inputs.repo }}
              ISSUE_NUMBER: ${{ string(inputs.issue_number) }}
              BASE_BRANCH: ${{ inputs.base_branch }}
              REQUIRE_AGENT_READY: ${{ string(inputs.require_agent_ready) }}
              RALPHEX_CONFIG: ${{ inputs.ralphex_config }}
        dependsOn: []
        weight: 0
        allowFailure: false
        labels:
          pool: coding
    dependsOn: []
    weight: 0
  - name: vault-sync
    description: >-
      Best-effort mirror of the ralphex run (progress log, ticket, PR link) into
      the Obsidian vault. Runs whether main succeeded or failed, and never fails
      the overall workflow run.
    dependsOn:
      - job: main
        condition:
          type: always
    weight: 0
    steps:
      - name: vault-pull
        description: Bring the local vault checkout up to date before writing.
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: pull
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: write-note
        description: >-
          Render this run's ticket.md and runs/<timestamp>.md into the vault checkout.
          Scoped to this run's own result (not data.latest's global-newest) so a killed
          or timed-out implement-github-issue that produced no output doesn't fall back
          to a stale note from an unrelated prior run/issue.
        guard: >-
          ${{ size(data.query('modelName == "github_ticket_worker_shell" && name ==
          "result" && workflowRunId == "' + run.id + '"')) > 0 }}
        task:
          type: model_method
          modelIdOrName: vault_note_writer_shell
          methodName: execute
          inputs:
            run: scripts/vault-write-note.sh
            workingDir: .
            timeout: 60000
            env:
              NOTE_JSON_RAW: >-
                ${{ data.query('modelName == "github_ticket_worker_shell" && name ==
                "result" && workflowRunId == "' + run.id + '"')[0].attributes.stdout }}
              VAULT_DIR: .vault-clone
        dependsOn:
          - step: vault-pull
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: vault-commit
        description: Commit the rendered note(s); guarded off when there was nothing to sync.
        guard: ${{ !data.latest("vault_note_writer_shell", "result").attributes.stdout.contains("NOTE_WRITTEN") }}
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: commit
          inputs:
            message: "chore: sync ralphex run notes"
            addAll: true
        dependsOn:
          - step: write-note
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: vault-push
        description: Push the synced notes to the vault remote.
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: push
          inputs:
            branch: main
            setUpstream: true
        dependsOn:
          - step: vault-commit
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
version: 1
