id: e6331f78-b80c-485e-bbfb-3584df4ae1b7
name: github-ticket-poller-streamberg
description: >-
  Scans mkoziy/streamberg for open issues labeled agent-ready that already
  have a ralphex plan committed to an agent/issue-<N> branch, and triggers
  github-ticket-worker for each. Runs on a cron trigger via swamp serve.
trigger:
  schedule: "*/15 * * * *"
  inputs:
    repo: mkoziy/streamberg
inputs:
  type: object
  properties:
    repo:
      type: string
      description: GitHub repository in owner/name form to poll.
    base_branch:
      type: string
      default: main
      description: Branch implementation branches are compared against.
    label:
      type: string
      default: agent-ready
      description: Issue label that marks a ticket as eligible for polling.
    ralphex_config:
      type: string
      default: ralphex-pi
      enum:
        - ralphex-codex
        - ralphex-pi
      description: ralphex profile passed through to triggered github-ticket-worker runs.
    server_url:
      type: string
      default: ws://127.0.0.1:9090
      description: >-
        Loopback URL of the swamp serve instance this poller runs under. Required so the
        triggered github-ticket-worker run dispatches to enrolled pool:coding workers instead
        of running as a disconnected local process with no worker dispatcher.
    gh_token_override:
      type: string
      default: ${{ vault.get('github-tokens', 'STREAMBERG_GH_TOKEN') }}
      description: >-
        Fine-grained PAT scoped to mkoziy/streamberg. The pod-level GH_TOKEN belongs to a
        different owner and can't reach this repo, so this poller carries its own token.
  required:
    - repo
tags: {}
jobs:
  - name: main
    description: Trigger github-ticket-worker for every issue with a ready plan branch.
    steps:
      - name: poll-and-trigger
        description: List agent-ready issues with a committed plan and run the worker for each.
        task:
          type: model_method
          modelIdOrName: github_ticket_poller_shell
          methodName: execute
          inputs:
            run: scripts/github-ticket-poller.sh
            workingDir: .
            timeout: 300000
            env:
              REPO: ${{ inputs.repo }}
              BASE_BRANCH: ${{ inputs.base_branch }}
              LABEL: ${{ inputs.label }}
              RALPHEX_CONFIG: ${{ inputs.ralphex_config }}
              SWAMP_SERVE_URL: ${{ inputs.server_url }}
              GH_TOKEN_OVERRIDE: ${{ inputs.gh_token_override }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
