id: b26d0c91-bcc1-40ad-a315-e0920c11b547
name: github-qa-worker
description: >-
  QAs the pull request a github-ticket-worker run already opened for an
  agent-qa-ready issue: checks out the PR at its pinned head commit, runs a
  coding agent directly (codex exec / pi --print, no ralphex) to start the
  app, run e2e tests if present, and drive it with agent-browser, then
  posts a pass/fail verdict with screenshots back to the issue and swaps
  the QA label.
inputs:
  type: object
  properties:
    repo:
      type: string
      description: GitHub repository in owner/name form.
    issue_number:
      type: integer
      description: Open GitHub issue number, labeled agent-qa-ready, to QA.
    ralphex_config:
      type: string
      default: ralphex-codex
      enum:
        - ralphex-codex
        - ralphex-pi
      description: >-
        Selects codex vs pi for this QA run. Kept as ralphex-codex/ralphex-pi
        purely to share the dev flow's label/enum vocabulary — QA never runs
        ralphex itself.
    qa_timeout_seconds:
      type: integer
      default: 1800
      description: Wall-clock timeout for the whole QA agent pass.
  required:
    - repo
    - issue_number
tags: {}
jobs:
  - name: main
    description: Check out the PR, run the QA agent, and post a verdict.
    steps:
      - name: run-qa
        description: Runs the isolated QA worker slice.
        task:
          type: model_method
          modelIdOrName: github_qa_worker_shell
          methodName: execute
          inputs:
            run: scripts/github-qa-worker.sh
            workingDir: .
            timeout: 2400000
            env:
              REPO: ${{ inputs.repo }}
              ISSUE_NUMBER: ${{ string(inputs.issue_number) }}
              RALPHEX_CONFIG: ${{ inputs.ralphex_config }}
              QA_TIMEOUT_SECONDS: ${{ string(inputs.qa_timeout_seconds) }}
              WORKFLOW_RUN_ID: ${{ run.id }}
              RUN_ARTIFACTS_DIR: /var/lib/swamp-worker-artifacts
        dependsOn: []
        weight: 0
        allowFailure: false
        labels:
          pool: qa
    dependsOn: []
    weight: 0
  - name: vault-sync
    description: >-
      Best-effort mirror of the QA run (verdict, screenshots, PR link) into
      the Obsidian vault, on the same per-issue timeline github-ticket-worker
      writes to. Runs whether main succeeded or failed, and never fails the
      overall workflow run.
    dependsOn:
      - job: main
        condition:
          type: always
    weight: 0
    steps:
      - name: vault-pull
        description: Bring the local vault checkout up to date before writing.
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: pull
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: write-note
        description: >-
          Append this QA run to runs/<timestamp>.md and regenerate ticket.md,
          using scripts/vault-write-note.sh — same schema/writer as the dev
          flow, see its note.json in RUN_ARTIFACTS_DIR.
        task:
          type: model_method
          modelIdOrName: vault_note_writer_shell
          methodName: execute
          inputs:
            run: scripts/vault-write-note.sh
            workingDir: .
            timeout: 60000
            env:
              NOTE_JSON_RAW: >-
                ${{ size(data.query('modelName == "github_qa_worker_shell" && name ==
                "result" && workflowRunId == "' + run.id + '"')) > 0
                ? data.query('modelName == "github_qa_worker_shell" && name ==
                "result" && workflowRunId == "' + run.id + '"')[0].attributes.stdout : "" }}
              REPO: ${{ inputs.repo }}
              ISSUE_NUMBER: ${{ string(inputs.issue_number) }}
              RALPHEX_CONFIG: ${{ inputs.ralphex_config }}
              WORKFLOW_RUN_ID: ${{ run.id }}
              RUN_ARTIFACTS_DIR: /var/lib/swamp-worker-artifacts
              VAULT_DIR: .swamp/vault-clone
        dependsOn:
          - step: vault-pull
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: vault-commit
        description: Commit the note rendered by the preceding successful write step.
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: commit
          inputs:
            message: "chore: sync QA run notes"
            addAll: true
        dependsOn:
          - step: write-note
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: vault-push
        description: Push the synced notes to the vault remote.
        task:
          type: model_method
          modelIdOrName: vault-repo
          methodName: push
          inputs:
            branch: main
            setUpstream: true
        dependsOn:
          - step: vault-commit
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: cleanup-artifacts
        description: Remove this run's artifacts only after its vault note has been pushed.
        task:
          type: model_method
          modelIdOrName: vault_note_writer_shell
          methodName: execute
          inputs:
            run: scripts/cleanup-run-artifacts.sh
            workingDir: .
            timeout: 60000
            env:
              WORKFLOW_RUN_ID: ${{ run.id }}
              RUN_ARTIFACTS_DIR: /var/lib/swamp-worker-artifacts
        dependsOn:
          - step: vault-push
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
version: 1
